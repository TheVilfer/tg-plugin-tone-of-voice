name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # tg-plugin build bundles with Bun; the same version gives the same dist/plugin.js

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund
      - name: dist/plugin.js is in git
        run: |
          git ls-files --error-unmatch -- dist/plugin.js || { echo '::error::dist/plugin.js is not in git: run "npm run build" and commit it'; exit 1; }
      - run: npm run build
      - name: dist/plugin.js matches the source
        # plugin install fetches the files of a commit, so the built code must be committed as built
        run: |
          git diff --exit-code HEAD -- dist/plugin.js || { echo '::error::Run "npm run build" and commit dist/plugin.js'; exit 1; }
      - name: Typecheck (plugin code as ES2023 without Node or DOM, then the tests)
        run: npm run typecheck
      - name: Lint (Ultracite on oxlint and oxfmt, no comments in code)
        run: npm run lint
      - name: telegram plugin validate with the released CLI
        env:
          HOME: ${{ runner.temp }}/home
          TG_MOCK: ${{ runner.temp }}/home/mock.json
        run: |
          mkdir -p "$HOME"
          npm install -g better-tg-cli@0.41.0
          telegram plugin validate .
          telegram plugin dev . collect --mock --input '{"limit":20,"types":["private","group"]}'
      - name: Mock tests (no Telegram, no network)
        env:
          HOME: ${{ runner.temp }}/home
        run: npm test
